# Qt-free core, slice 6: bot platform — Docker Compose
# Run: docker compose up -d --build bbot
# Stop: docker compose down

services:
  bot:
    build: .
    container_name: bbot
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 512m
    # read-only root with tmpfs /tmp
    tmpfs: /tmp:noexec,nosuid,size=64m
    # data volume for the node folder and phrase
    volumes:
      - bot-data:/home/bot/node-data
      - ./phrase:/home/bot/.phrase:ro
    # port 8444 is the default NTB_PROTO_DEFAULT_PORT
    ports:
      - "8444:8444"
    # health check uses the responder C ABI
    healthcheck:
      test: ["CMD", "chat_responder", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    # environment: the phrase as a secret file volume is already mounted
    # environment:
    #   - PHRASE_FILE=/home/bot/.phrase

volumes:
  bot-data: